/* ===== UNIVERSAL FIX FOR DESKTOP SITE MODE ===== */

/* Ensure all clickable elements work properly */
button,
a,
.subject-tab,
.filter-btn,
.palette-item,
.option,
.nav-menu a,
.btn,
.action-btn,
.rating-btn,
.deck-card,
.flashcard {
    cursor: pointer;
    position: relative;
    z-index: auto;
    -webkit-tap-highlight-color: transparent;
}

/* Fix for sticky headers that might block clicks */
.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: white;
}

/* Ensure main content doesn't get hidden under header */
main, .container, .practice-container, .flashcards-container, .results-container {
    position: relative;
    z-index: 1;
}

/* Fix for subject tabs - ensure they're clickable */
.subject-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    position: relative;
    z-index: 10;
}

.subject-tab {
    cursor: pointer;
    pointer-events: auto;
    position: relative;
    z-index: 20;
}

/* Fix for palette items */
.palette-grid {
    display: grid;
    gap: 10px;
}

.palette-item {
    cursor: pointer;
    pointer-events: auto;
    position: relative;
    z-index: 5;
}

/* Override any transform that might break click area */
.palette-item.current,
.subject-tab.active {
    transform: none !important;
}

/* Ensure all buttons are clickable on desktop view */
@media (min-width: 769px) {
    .subject-tab,
    .filter-btn,
    .palette-item,
    .option,
    .nav-menu a,
    .btn,
    .action-btn {
        cursor: pointer;
        transition: all 0.2s ease;
    }
    
    .subject-tab:hover,
    .filter-btn:hover,
    .palette-item:hover,
    .option:hover {
        transform: translateY(-2px);
    }
    
    /* Fix for any elements with transform that might block clicks */
    .subject-tab:active,
    .filter-btn:active,
    .palette-item:active {
        transform: scale(0.98);
    }
}

        }

            color: white;

        }

        .calc-btn.operator {
            background: #667eea;
            color: white;
        }

        .calc-btn.operator:hover {
            background: #5a6fd8;
            transform: scale(0.95);
        }

        .calc-btn.equals {
            background: #27ae60;
            color: white;
            grid-column: span 2;
        }

        .calc-btn.clear {
            background: #e74c3c;
            color: white;
        }

        .calc-btn:active {
            transform: scale(0.92);
            opacity: 0.8;
        }

@media (max-width: 900px) and (orientation: landscape) {
            .calculator-modal-content {
                width: 400px;
                max-width: 80vw;
            }

            .calc-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>

        <div class="navigation-buttons">
            <button class="nav-btn prev-btn" id="prevBtn" disabled>← Previous</button>
            <button class="nav-btn next-btn" id="nextBtn">Next →</button>
            <button class="nav-btn submit-btn" id="submitBtn" style="display: none;">Submit Exam</button>
        </div>

        <div class="question-palette">
            <div class="palette-title">
                Question Palette
                <div class="subject-filter" id="subjectFilter"></div>
            </div>
            <div class="palette-grid" id="paletteGrid"></div>
        </div>
    </div>

    <!-- Calculator Modal (unchanged) -->
    <div id="calculatorModal" class="calculator-modal" style="display: none;" onclick="handleModalClick(event)">
        <div class="calculator-modal-content" id="calculatorContent" onclick="event.stopPropagation()">
            <div class="calculator-modal-header" id="calculatorHeader">
                <h3><span>🧮</span> Calculator <span class="drag-indicator">↗️</span></h3>
                <button class="close-btn" onclick="toggleCalculator(event)">✕</button>
            </div>
            <div id="examCalculator" class="exam-calculator"></div>
        </div>
    </div>

    <!-- Include scripts -->
    <script src="js/exam.js"></script>
    <script src="js/pwa.js"></script>
    <script>
        // Fullscreen toggle
        const fullBtn = document.getElementById('fullscreenBtn');
        fullBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.body.classList.add('fullscreen-mode');
                fullBtn.textContent = '✕';
            } else {
                document.exitFullscreen();
                document.body.classList.remove('fullscreen-mode');
                fullBtn.textContent = '⛶';
            }
        });
        // Warn before leaving
        window.addEventListener('beforeunload', (e) => {
            if (typeof examState !== 'undefined' && examState.timeRemaining > 0 && examState.timeRemaining < 7200) {
                e.preventDefault();
                e.returnValue = 'Exam in progress. Leave? Progress will be lost.';
                return e.returnValue;
            }
        });
    </script>
</body>
</html>
