<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAMB Simulator - Practice Mode</title>
    <link rel="manifest" href="/manifest.json">
     <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="JAMB Simulator">
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png">
    <meta name="theme-color" content="#1a1a2e">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fb;
            color: #1a1a2e;
            line-height: 1.5;
        }

        .header {
            background: white;
            border-bottom: 1px solid #e1e5eb;
            padding: 0.75rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a1a2e;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 0.25rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-menu a {
            color: #4a5568;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: #f0f0f5;
            color: #1a1a2e;
        }

        #userInfo {
            font-size: 0.75rem;
            color: #718096;
            margin-left: 0.5rem;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #e1e5eb;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a2e;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #718096;
            margin-top: 0.25rem;
        }

        .setup-panel {
            background: white;
            border-radius: 16px;
            border: 1px solid #e1e5eb;
            padding: 1.5rem;
        }

        .setup-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.375rem;
            color: #4a5568;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 0.625rem 0.75rem;
            border: 1px solid #e1e5eb;
            border-radius: 8px;
            font-size: 0.875rem;
            background: white;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #1a1a2e;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #1a1a2e;
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: #2d2d44;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .practice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .info-badge {
            background: #f0f0f5;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #4a5568;
        }

        .question-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e1e5eb;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .question-text {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .practice-option {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            border: 1px solid #e1e5eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #f8f9fc;
            border-color: #cbd5e0;
        }

        .practice-option.selected {
            background: #f0f0f5;
            border-color: #1a1a2e;
        }

        .practice-option.correct {
            background: #e6f4ea;
            border-color: #2d6a4f;
        }

        .practice-option.wrong {
            background: #fee8e8;
            border-color: #c92a2a;
        }

        .option-letter {
            font-weight: 600;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f5;
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .feedback-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
            display: none;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-correct {
            color: #2d6a4f;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .feedback-wrong {
            color: #c92a2a;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .explanation-text {
            color: #4a5568;
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .action-btn {
            flex: 1;
            padding: 0.625rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn-check {
            background: #1a1a2e;
            color: white;
        }

        .action-btn-check:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .action-btn-next {
            background: #e2e8f0;
            color: #4a5568;
        }

        .action-btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .summary-panel {
            background: white;
            border-radius: 16px;
            border: 1px solid #e1e5eb;
            padding: 2rem;
            text-align: center;
        }

        .summary-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        .summary-stat .number {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .summary-stat .label {
            font-size: 0.75rem;
            color: #718096;
        }

        .motivation-message {
            margin: 1rem 0;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .summary-buttons {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .hidden {
            display: none;
        }

        .encouragement-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 1000;
            border-left: 3px solid #e6a017;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
            }
            .nav-menu {
                justify-content: center;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .action-buttons {
                flex-direction: column;
            }
            .summary-stats {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <div class="logo">JAMB Simulator 2026</div>
            <ul class="nav-menu">
                <li><a href="home.html">Back To Home</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalPracticed">0</div>
                <div class="stat-label">Questions Practiced</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="correctRate">0%</div>
                <div class="stat-label">Accuracy</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="streakCount">0</div>
                <div class="stat-label">Current Streak</div>
            </div>
        </div>

        <!-- Setup View -->
        <div id="practiceSetup">
            <div class="setup-panel">
                <div class="setup-title">Practice Mode</div>
                
                <div class="form-group">
                    <label>Subject</label>
                    <select id="subjectSelect">
                        <option value="">Loading subjects...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Topic (Optional)</label>
                    <select id="topicSelect" disabled>
                        <option value="all">All Topics</option>
                    </select>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Difficulty</label>
                        <select id="difficultySelect">
                            <option value="all">All Levels</option>
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Number of Questions</label>
                        <input type="number" id="questionCount" min="5" max="50" value="10">
                    </div>
                </div>
                
                <button class="btn btn-primary" onclick="startPractice()">Start Practice</button>
            </div>
        </div>

        <!-- Practice Area -->
        <div id="practiceArea" class="hidden">
            <div class="practice-header">
                <div>
                    <span class="info-badge" id="currentSubject">-</span>
                    <span class="info-badge" id="currentTopic">-</span>
                    <span class="info-badge" id="currentDifficulty">-</span>
                </div>
                <div class="info-badge" id="progressText">Question 0/0</div>
            </div>
            
            <div class="question-card">
                <div class="question-text" id="questionText">Loading...</div>
                <div class="options-list" id="optionsContainer"></div>
                
                <div class="feedback-box" id="feedbackBox">
                    <div id="feedbackMessage"></div>
                    <div class="explanation-text" id="explanation"></div>
                </div>
            </div>
            
            <div class="action-buttons">
                <button class="action-btn action-btn-check" id="checkBtn" onclick="checkAnswer()">Check Answer</button>
                <button class="action-btn action-btn-next" id="nextBtn" onclick="nextQuestion()" disabled>Next</button>
            </div>
        </div>

        <!-- Summary View -->
        <div id="practiceSummary" class="hidden">
            <div class="summary-panel">
                <h2 style="margin-bottom: 0.5rem;">Session Complete!</h2>
                
                <div class="summary-stats">
                    <div class="summary-stat">
                        <div class="number" id="summaryCorrect">0</div>
                        <div class="label">Correct</div>
                    </div>
                    <div class="summary-stat">
                        <div class="number" id="summaryWrong">0</div>
                        <div class="label">Wrong</div>
                    </div>
                    <div class="summary-stat">
                        <div class="number" id="summaryAccuracy">0%</div>
                        <div class="label">Accuracy</div>
                    </div>
                </div>
                
                <div class="motivation-message" id="motivationalMessage"></div>
                
                <div class="summary-buttons">
                    <button class="btn btn-primary" onclick="practiceAgain()">Practice Again</button>
                    <button class="btn btn-secondary" onclick="reviewMistakes()">Review Mistakes</button>
                    <button class="btn btn-secondary" onclick="sharePracticeResults()">Share</button>
                </div>
            </div>
        </div>
    </div>
<script src="js/authUI.js"></script>
    <script src="js/streak.js"></script>
    <script src="js/practice.js"></script>
</body>
</html>
