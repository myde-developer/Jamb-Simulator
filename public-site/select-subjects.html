<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>JAMB Simulator - Select Subjects</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="global.css">
    <meta name="theme-color" content="#1a1a2e">
    <style>
        /* Copy the subject card styles from your original home.html */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fb; color: #1a1a2e; }
        .header { background: white; border-bottom: 1px solid #e1e5eb; padding: 0.75rem 0; position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo { font-size: 1.25rem; font-weight: 700; color: #1a1a2e; }
        .nav-menu { display: flex; list-style: none; gap: 0.25rem; flex-wrap: wrap; align-items: center; }
        .nav-menu a { color: #4a5568; text-decoration: none; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.875rem; transition: all 0.2s; }
        .nav-menu a:hover { background: #f0f0f5; color: #1a1a2e; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
        .page-header { text-align: center; margin-bottom: 2rem; }
        .page-header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #1a1a2e; }
        .page-header p { color: #718096; }
        .subjects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
        .subject-card { background: white; border: 1px solid #e1e5eb; border-radius: 12px; padding: 1rem; cursor: pointer; transition: all 0.2s; position: relative; }
        .subject-card:hover { border-color: #1a1a2e; transform: translateY(-2px); }
        .subject-card.selected { border-color: #1a1a2e; background: #f8f9fc; }
        .subject-name { font-weight: 600; margin-bottom: 0.25rem; font-size: 0.9rem; }
        .subject-code { font-size: 0.7rem; color: #718096; }
        .check-icon { position: absolute; top: 0.5rem; right: 0.5rem; color: #2d6a4f; display: none; }
        .subject-card.selected .check-icon { display: block; }
        .category-title { grid-column: 1/-1; font-size: 1rem; font-weight: 600; margin: 1rem 0 0.5rem; padding-bottom: 0.25rem; border-bottom: 2px solid #e1e5eb; color: #4a5568; }
        .selection-info { text-align: center; padding: 1rem; background: white; border-radius: 12px; border: 1px solid #e1e5eb; margin-top: 1rem; }
        .start-btn { background: #1a1a2e; color: white; border: none; padding: 0.75rem 2rem; font-size: 1rem; border-radius: 8px; cursor: pointer; margin-top: 1rem; transition: all 0.2s; }
        .start-btn:hover:not(:disabled) { background: #2d2d44; }
        .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .footer { text-align: center; padding: 2rem; color: #718096; font-size: 0.75rem; border-top: 1px solid #e1e5eb; margin-top: 3rem; }
        @media (max-width: 768px) {
            .subjects-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <div class="logo">JAMB Simulator 2026</div>
            <ul class="nav-menu">
                <li><a href="home.html">Back To Home</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <div class="page-header">
            <h1>Select Your Exam Subjects</h1>
            <p>English is compulsory. Choose 3 more subjects to complete your JAMB mock exam.</p>
        </div>
        <div class="subjects-grid" id="subjectsContainer"></div>
        <div class="selection-info">
            <p>Selected: <span id="selectedCount">1</span>/4 subjects</p>
            <p style="font-size: 0.75rem; margin-top: 0.5rem;">English: 60 questions | Others: 40 questions each</p>
            <button id="startExamBtn" class="start-btn" disabled>Start Exam</button>
        </div>
    </div>
    <footer class="footer"><p>&copy; 2026 JAMB Exam Simulator | All 22 Subjects</p></footer>
    <script src="js/streak.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/authUI.js"></script>
</body>
</html>
