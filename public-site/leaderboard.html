<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAMB Simulator - Leaderboard</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="global.css">
    <style>
        .podium { display: flex; justify-content: center; gap: 20px; margin: 30px 0; }
        .podium-item { text-align: center; width: 120px; }
        .podium-item.first .medal { font-size: 3rem; }
        .medal { font-size: 2rem; }
        .leaderboard-table { background: white; border-radius: 20px; overflow: hidden; }
        .table-row { display: grid; grid-template-columns: 80px 1fr 100px 80px; padding: 12px; border-bottom: 1px solid var(--gray-200); }
        .table-header { background: var(--gray-100); font-weight: 600; }
        .user-avatar { width: 32px; height: 32px; background: var(--primary); color: white; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-right: 10px; }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <div class="logo">JAMB Simulator 2026</div>
            <ul class="nav-menu">
                <li><a href="home.html">Home</a></li>
                <li><a href="practice.html">Practice</a></li>
                <li><a href="flashcards.html">Flashcards</a></li>
                <li><a href="progress.html">Progress</a></li>
                <li><a href="leaderboard.html" class="active">Leaderboard</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <div class="page-header"><h1>Leaderboard</h1><p>Compete with other JAMB aspirants</p></div>
        <div class="leaderboard-tabs"><button class="leaderboard-tab active" data-type="global" onclick="switchLeaderboard('global')">Global</button><button class="leaderboard-tab" data-type="weekly" onclick="switchLeaderboard('weekly')">This Week</button><button class="leaderboard-tab" data-type="monthly" onclick="switchLeaderboard('monthly')">This Month</button></div>
        <div class="filter-section"><input type="text" id="searchUser" placeholder="Search your name..." onkeyup="searchLeaderboard()"></div>
        <div id="podiumContainer" class="podium"></div>
        <div class="leaderboard-table"><div class="table-header"><div>Rank</div><div>User</div><div>Score</div><div>Exams</div></div><div id="leaderboardRows"></div></div>
        <div id="yourRank" class="your-rank"></div>
    </div>
    <script src="js/streak.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
