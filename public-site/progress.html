<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAMB Simulator - My Progress</title>
    <link rel="manifest" href="/manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="JAMB Simulator">
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png">
    <meta name="theme-color" content="#1a1a2e">
    
    <style>
/* ===== UNIVERSAL FIX FOR DESKTOP SITE MODE ===== */

/* Ensure all clickable elements work properly */
button,
a,
.subject-tab,
.filter-btn,
.palette-item,
.option,
.nav-menu a,
.btn,
.action-btn,
.rating-btn,
.deck-card,
.flashcard {
    cursor: pointer;
    position: relative;
    z-index: auto;
    -webkit-tap-highlight-color: transparent;
}

/* Fix for sticky headers that might block clicks */
.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: white;
}

/* Ensure main content doesn't get hidden under header */
main, .container, .practice-container, .flashcards-container, .results-container {
    position: relative;
    z-index: 1;
}

/* Fix for subject tabs - ensure they're clickable */
.subject-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    position: relative;
    z-index: 10;
}

.subject-tab {
    cursor: pointer;
    pointer-events: auto;
    position: relative;
    z-index: 20;
}

/* Fix for palette items */
.palette-grid {
    display: grid;
    gap: 10px;
}

.palette-item {
    cursor: pointer;
    pointer-events: auto;
    position: relative;
    z-index: 5;
}

/* Override any transform that might break click area */
.palette-item.current,
.subject-tab.active {
    transform: none !important;
}

/* Ensure all buttons are clickable on desktop view */
@media (min-width: 769px) {
    .subject-tab,
    .filter-btn,
    .palette-item,
    .option,
    .nav-menu a,
    .btn,
    .action-btn {
        cursor: pointer;
        transition: all 0.2s ease;
    }
    
    .subject-tab:hover,
    .filter-btn:hover,
    .palette-item:hover,
    .option:hover {
        transform: translateY(-2px);
    }
    
    /* Fix for any elements with transform that might block clicks */
    .subject-tab:active,
    .filter-btn:active,
    .palette-item:active {
        transform: scale(0.98);
    }
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .page-header {
            background: white;
            border: 1px solid #e1e5eb;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .page-header p {
            color: #718096;
            font-size: 0.875rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e1e5eb;
            padding: 1rem;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a2e;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #718096;
            margin-top: 0.25rem;
        }

        .subject-progress {
            background: white;
            border-radius: 16px;
            border: 1px solid #e1e5eb;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .subject-progress h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .subject-bar {
            margin-bottom: 1rem;
        }

        .subject-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.25rem;
            font-size: 0.875rem;
        }

        .subject-name {
            font-weight: 500;
        }

        .subject-percent {
            color: #718096;
        }

        .progress-bg {
            width: 100%;
            height: 6px;
            background: #e1e5eb;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill-subject {
            height: 100%;
            background: #1a1a2e;
            border-radius: 3px;
            transition: width 0.3s;
        }

        .recent-exams {
            background: white;
            border-radius: 16px;
            border: 1px solid #e1e5eb;
            padding: 1.5rem;
        }

        .recent-exams h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .exam-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #e1e5eb;
        }

        .exam-item:last-child {
            border-bottom: none;
        }

        .exam-date {
            font-size: 0.875rem;
            color: #718096;
        }

        .exam-score {
            font-weight: 600;
            color: #2d6a4f;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #718096;
        }

        .no-data {
            text-align: center;
            padding: 2rem;
            color: #718096;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
            }
            
            .nav-menu {
                justify-content: center;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .exam-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.25rem;
            }
        }
    </style>
