<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAMB Simulator - Flashcards</title>
    <link rel="manifest" href="/manifest.json">
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="JAMB Simulator">
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png">
    <meta name="theme-color" content="#1a1a2e">
    
    <style>
/* ===== UNIVERSAL FIX FOR DESKTOP SITE MODE ===== */

/* Ensure all clickable elements work properly */
button,
a,
.subject-tab,
.filter-btn,
.palette-item,
.option,
.nav-menu a,
.btn,
.action-btn,
.rating-btn,
.deck-card,
.flashcard {
    cursor: pointer;
    position: relative;
    z-index: auto;
    -webkit-tap-highlight-color: transparent;
}

/* Fix for sticky headers that might block clicks */
.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: white;
}

/* Ensure main content doesn't get hidden under header */
main, .container, .practice-container, .flashcards-container, .results-container {
    position: relative;
    z-index: 1;
}

/* Fix for subject tabs - ensure they're clickable */
.subject-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    position: relative;
    z-index: 10;
}

.subject-tab {
    cursor: pointer;
    pointer-events: auto;
    position: relative;
    z-index: 20;
}

/* Fix for palette items */
.palette-grid {
    display: grid;
    gap: 10px;
}

.palette-item {
    cursor: pointer;
    pointer-events: auto;
    position: relative;
    z-index: 5;
}

/* Override any transform that might break click area */
.palette-item.current,
.subject-tab.active {
    transform: none !important;
}

/* Ensure all buttons are clickable on desktop view */
@media (min-width: 769px) {
    .subject-tab,
    .filter-btn,
    .palette-item,
    .option,
    .nav-menu a,
    .btn,
    .action-btn {
        cursor: pointer;
        transition: all 0.2s ease;
    }
    
    .subject-tab:hover,
    .filter-btn:hover,
    .palette-item:hover,
    .option:hover {
        transform: translateY(-2px);
    }
    
    /* Fix for any elements with transform that might block clicks */
    .subject-tab:active,
    .filter-btn:active,
    .palette-item:active {
        transform: scale(0.98);
    }
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fb;
            color: #1a1a2e;
            line-height: 1.5;
        }

        .header {
            background: white;
            border-bottom: 1px solid #e1e5eb;
            padding: 0.75rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a1a2e;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 0.25rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-menu a {
            color: #4a5568;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: #f0f0f5;
            color: #1a1a2e;
        }

        #userInfo {
            font-size: 0.75rem;
            color: #718096;
            margin-left: 0.5rem;
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .stat-card {
            background: white;
            padding: 1rem;
            border-radius: 12px;
            flex: 1;
            text-align: center;
            border: 1px solid #e1e5eb;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a2e;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #718096;
            margin-top: 0.25rem;
        }

        .section-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        /* Deck Grid */
        .deck-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .deck-card {
            background: white;
            border: 1px solid #e1e5eb;
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .deck-card:hover {
            transform: translateY(-2px);
            border-color: #cbd5e0;
        }

        .deck-actions {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: flex;
            gap: 0.25rem;
        }

        .deck-actions button {
            background: none;
            border: none;
            font-size: 0.875rem;
            cursor: pointer;
            padding: 0.25rem;
            opacity: 0.5;
        }

        .deck-actions button:hover {
            opacity: 1;
        }

        .deck-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
            padding-right: 3rem;
        }

        .deck-meta {
            font-size: 0.75rem;
            color: #718096;
            margin-bottom: 0.5rem;
        }

        .deck-stats {
            display: flex;
            gap: 0.75rem;
            font-size: 0.7rem;
            color: #718096;
            border-top: 1px solid #e1e5eb;
            padding-top: 0.5rem;
            margin-top: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            border: 1px solid #e1e5eb;
        }

        .empty-state p {
            color: #718096;
            margin-bottom: 1rem;
        }

        /* Setup Panel */
        .setup-panel {
            background: white;
            border-radius: 16px;
            border: 1px solid #e1e5eb;
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.375rem;
            color: #4a5568;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.625rem 0.75rem;
            border: 1px solid #e1e5eb;
            border-radius: 8px;
            font-size: 0.875rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1a1a2e;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #1a1a2e;
            color: white;
        }

        .btn-primary:hover {
            background: #2d2d44;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        /* Flashcard Session */
        .flashcard {
            background: white;
            border-radius: 20px;
            border: 1px solid #e1e5eb;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.2s;
        }

        .flashcard:hover {
            border-color: #cbd5e0;
        }

        .flashcard-header {
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid #e1e5eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .flashcard-subject {
            font-size: 0.75rem;
            font-weight: 500;
            color: #1a1a2e;
            background: #f0f0f5;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
        }

        .flashcard-counter {
            font-size: 0.75rem;
            color: #718096;
        }

        .flashcard-body {
            flex: 1;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .flashcard-question {
            font-size: 1rem;
            line-height: 1.6;
            color: #1a1a2e;
        }

        .flashcard-answer {
            font-size: 0.875rem;
            line-height: 1.6;
            color: #2d6a4f;
            background: #f0f9f0;
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1rem;
            display: none;
            text-align: left;
        }

        .flashcard-answer.show {
            display: block;
        }

        .flip-hint {
            padding: 0.75rem 1.25rem;
            text-align: right;
            font-size: 0.7rem;
            color: #a0aec0;
            border-top: 1px solid #e1e5eb;
        }

        /* Rating Buttons */
        .rating-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .rating-btn {
            flex: 1;
            padding: 0.625rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .rating-easy {
            background: #2d6a4f;
            color: white;
        }

        .rating-easy:hover {
            background: #1b4d3b;
        }

        .rating-medium {
            background: #e6a017;
            color: white;
        }

        .rating-medium:hover {
            background: #c4880e;
        }

        .rating-hard {
            background: #c92a2a;
            color: white;
        }

        .rating-hard:hover {
            background: #a51e1e;
        }

        /* Summary Panel */
        .summary-panel {
            background: white;
            border-radius: 16px;
            border: 1px solid #e1e5eb;
            padding: 1.5rem;
            text-align: center;
        }

        .summary-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        .summary-stat .number {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .summary-stat .label {
            font-size: 0.75rem;
            color: #718096;
        }

        .summary-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
            }
            
            .nav-menu {
                justify-content: center;
            }
            
            .stats-bar {
                flex-direction: column;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .rating-buttons {
                flex-direction: column;
            }
            
            .summary-stats {
                gap: 1rem;
            }
            
            .summary-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <div class="logo">JAMB Simulator 2026</div>
            <ul class="nav-menu">
                <li><a href="home.html">Back To Home</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-number" id="totalCards">0</div>
                <div class="stat-label">Total Cards</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="masteredCards">0</div>
                <div class="stat-label">Mastered</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="dueCards">0</div>
                <div class="stat-label">Due for Review</div>
            </div>
        </div>

        <!-- Decks View -->
        <div id="decksView">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 class="section-title">My Decks</h2>
                <button class="btn btn-primary" onclick="showSetup()">+ New Deck</button>
            </div>
            <div class="deck-grid" id="deckList"></div>
        </div>

        <!-- Setup View -->
        <div id="setupView" class="hidden">
            <h2 class="section-title" id="setupTitle">Create New Deck</h2>
            <div class="setup-panel">
                <div class="form-group">
                    <label>Deck Name</label>
                    <input type="text" id="deckName" placeholder="e.g., Physics Formulas">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Subject</label>
                        <select id="subjectSelect">
                            <option value="">Select Subject</option>
                            <option value="1">Use of English</option>
                            <option value="2">Mathematics</option>
                            <option value="3">Physics</option>
                            <option value="4">Chemistry</option>
                            <option value="5">Biology</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Topic (Optional)</label>
                        <select id="topicSelect" disabled>
                            <option value="">Select Topic</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Number of Cards</label>
                    <input type="number" id="cardCount" min="5" max="50" value="20">
                </div>
                <div style="display: flex; gap: 0.75rem; justify-content: flex-end;">
                    <button class="btn btn-secondary" onclick="backToDecks()">Cancel</button>
                    <button class="btn btn-primary" onclick="startFlashcards()">Create & Start</button>
                </div>
            </div>
        </div>

        <!-- Session View -->
        <div id="sessionView" class="hidden">
            <div class="flashcard" onclick="flipCard()">
                <div class="flashcard-header">
                    <span class="flashcard-subject" id="progressSubject">-</span>
                    <span class="flashcard-counter" id="progressCount">0/0</span>
                </div>
                <div class="flashcard-body">
                    <div>
                        <div class="flashcard-question" id="questionText"></div>
                        <div class="flashcard-answer" id="answerText"></div>
                    </div>
                </div>
                <div class="flip-hint">Click to reveal answer</div>
            </div>
            <div class="rating-buttons">
                <button class="rating-btn rating-easy" onclick="rateCard('easy')">Easy</button>
                <button class="rating-btn rating-medium" onclick="rateCard('medium')">Medium</button>
                <button class="rating-btn rating-hard" onclick="rateCard('hard')">Hard</button>
            </div>
        </div>

        <!-- Summary View -->
        <div id="summaryView" class="hidden">
            <div class="summary-panel">
                <div class="summary-title" style="font-size: 1.25rem; font-weight: 600;">Session Complete!</div>
                <div class="summary-stats">
                    <div class="summary-stat">
                        <div class="number" id="masteredCount">0</div>
                        <div class="label">Mastered</div>
                    </div>
                    <div class="summary-stat">
                        <div class="number" id="reviewCount">0</div>
                        <div class="label">Review Later</div>
                    </div>
                    <div class="summary-stat">
                        <div class="number" id="struggleCount">0</div>
                        <div class="label">Needs Practice</div>
                    </div>
                </div>
                <div class="summary-actions">
                    <button class="btn btn-primary" onclick="continueLearning()">Continue</button>
                    <button class="btn btn-secondary" onclick="backToDecks()">Back to Decks</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/streak.js"></script>
<script src="js/authUI.js"></script>
    <script src="js/flashcards.js"></script>
</body>
</html>
