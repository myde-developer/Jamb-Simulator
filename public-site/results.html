<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
    <title>JAMB Simulator - Results</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="JAMB Simulator">
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png">
    <meta name="theme-color" content="#1a1a2e">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fb; color: #1a1a2e; }
        .header { background: white; border-bottom: 1px solid #e1e5eb; padding: 0.75rem 0; position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo { font-size: 1.25rem; font-weight: 700; color: #1a1a2e; }
        .nav-menu { display: flex; list-style: none; gap: 0.25rem; flex-wrap: wrap; align-items: center; }
        .nav-menu a { color: #4a5568; text-decoration: none; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.875rem; }
        .nav-menu a:hover { background: #f0f0f5; color: #1a1a2e; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; }
        .results-header { background: white; border: 1px solid #e1e5eb; border-radius: 20px; padding: 2rem; margin-bottom: 1.5rem; text-align: center; }
        .score-circle { width: 140px; height: 140px; background: #1a1a2e; border-radius: 50%; margin: 1rem auto; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .score-number { font-size: 2.5rem; font-weight: 700; }
        .score-percentage { font-size: 1rem; font-weight: 500; color: #2d6a4f; margin-top: 0.5rem; }
        .summary-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .summary-card { background: white; border: 1px solid #e1e5eb; border-radius: 12px; padding: 1rem; text-align: center; }
        .summary-card h3 { font-size: 0.7rem; color: #718096; margin-bottom: 0.5rem; text-transform: uppercase; }
        .summary-value { font-size: 1.5rem; font-weight: 700; color: #1a1a2e; }
        .subject-breakdown { background: white; border: 1px solid #e1e5eb; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .subject-breakdown h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
        .subject-row { display: flex; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid #e1e5eb; }
        .share-btn { background: #f1c40f; color: #1a1a2e; }
        .subject-name { width: 140px; font-weight: 500; font-size: 0.875rem; }
        .subject-score-bar { flex: 1; height: 6px; background: #e1e5eb; border-radius: 3px; margin: 0 1rem; overflow: hidden; }
        .subject-score-fill { height: 100%; background: #1a1a2e; border-radius: 3px; }
        .subject-stats { min-width: 120px; text-align: right; font-size: 0.875rem; }
        .action-buttons { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .action-btn { flex: 1; padding: 0.625rem; border: none; border-radius: 8px; font-size: 0.875rem; font-weight: 500; cursor: pointer; }
        .review-btn { background: #1a1a2e; color: white; }
        .home-btn { background: #e2e8f0; color: #4a5568; }
        .pdf-btn { background: #2d6a4f; color: white; }
        .review-container { background: white; border: 1px solid #e1e5eb; border-radius: 16px; padding: 1.5rem; margin-top: 1.5rem; display: none; }
        .review-filters { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.375rem 0.875rem; border: 1px solid #e1e5eb; border-radius: 20px; background: white; cursor: pointer; font-size: 0.75rem; }
        .filter-btn.active { background: #1a1a2e; color: white; }
        .review-question { border: 1px solid #e1e5eb; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
        .review-question.correct { border-left: 4px solid #2d6a4f; }
        .review-question.incorrect { border-left: 4px solid #c92a2a; }
        .review-status { font-size: 0.75rem; padding: 0.25rem 0.75rem; border-radius: 20px; display: inline-block; }
        .status-correct { background: #2d6a4f; color: white; }
        .status-incorrect { background: #c92a2a; color: white; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: white; padding: 0.75rem 1.5rem; border-radius: 50px; font-size: 0.875rem; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        @media (max-width: 768px) {
            .summary-cards { grid-template-columns: repeat(2, 1fr); }
            .subject-row {display: flex; flex-direction: column; align-items: center; text-align: center; }
            .subject-name { margin-bottom: 0.25rem; font-weight: 600; }
            .subject-stats { text-align: center; }
            .subject-row:last-child { border-top: 2px solid #1a1a2e; margin-top: 1rem; padding-top: 1rem; }
            .action-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <div class="logo">JAMB Simulator 2026</div>
            <ul class="nav-menu">
                <li><a href="home.html">Back To Home</a></li>
                <li><span id="userInfo"></span></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <div class="results-header" id="resultsHeader"></div>
        <div class="summary-cards" id="summaryCards"></div>
        <div class="subject-breakdown" id="subjectBreakdown"></div>
<div class="action-buttons">
    <button class="action-btn review-btn" onclick="toggleReview()">Review Answers</button>
    <button class="action-btn home-btn" onclick="goHome()">Back to Home</button>
    <button class="action-btn share-btn" id="shareScoreBtn">Share Score Card</button>
</div>
 </div>
        <div class="review-container" id="reviewSection">
            <h2 style="font-size: 1rem; margin-bottom: 1rem;">Review Your Answers</h2>
            <div class="review-filters">
                <button class="filter-btn active" onclick="filterQuestions('all')">All</button>
                <button class="filter-btn" onclick="filterQuestions('correct')">Correct</button>
                <button class="filter-btn" onclick="filterQuestions('incorrect')">Incorrect</button>
            </div>
            <div id="reviewQuestions"></div>
        </div>
    </div>
    <div id="toast" class="toast">PDF downloaded successfully!</div>
<script src="js/authUI.js"></script>
    <script src="js/streak.js"></script>
    <script src="js/results.js"></script>
</body>
</html>
