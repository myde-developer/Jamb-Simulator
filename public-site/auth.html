<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAMB Simulator - Login / Register</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <div class="auth-card" style="max-width:400px; margin:100px auto;">
        <div class="logo">📚</div>
        <div class="auth-header">
            <h2 id="formTitle">Login</h2>
            <p id="formSubtitle">Welcome back!</p>
        </div>
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        <form id="authForm">
            <div class="form-group" id="nameGroup" style="display: none;">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary" id="submitBtn">Login</button>
        </form>
        <div class="auth-footer">
            <p id="toggleText">Don't have an account? <a href="#" id="toggleAuth">Register here</a></p>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
