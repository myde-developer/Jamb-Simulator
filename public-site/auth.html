<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAMB Simulator - Login</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="JAMB Simulator">
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png">
    <meta name="theme-color" content="#1a1a2e">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        
        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid #e1e5eb;
        }
        
        .logo {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .auth-header h2 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
            color: #1a1a2e;
        }
        
        .auth-header p {
            color: #718096;
            font-size: 0.875rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.375rem;
            color: #4a5568;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.625rem 0.75rem;
            border: 1px solid #e1e5eb;
            border-radius: 8px;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #1a1a2e;
        }
        
        .auth-btn {
            width: 100%;
            padding: 0.625rem;
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .auth-btn:hover {
            background: #2d2d44;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #718096;
        }
        
        .auth-footer a {
            color: #1a1a2e;
            text-decoration: none;
            font-weight: 500;
        }
        
        .error-message {
            background: #fee8e8;
            color: #c92a2a;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.875rem;
        }
        
        .success-message {
            background: #e6f4ea;
            color: #2d6a4f;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo">📚</div>
        
        <div class="auth-header">
            <h2 id="formTitle">Login</h2>
            <p id="formSubtitle">Welcome back!</p>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <form id="authForm">
            <div class="form-group" id="nameGroup" style="display: none;">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="auth-btn" id="submitBtn">Login</button>
        </form>
        
        <div class="auth-footer">
            <p id="toggleText">
                Don't have an account? 
                <a href="#" id="toggleAuth">Register</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
