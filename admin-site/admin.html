<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .admin-container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
        .stats-cards { display: grid; grid-template-columns: repeat(4,1fr); gap:20px; margin-bottom:30px; }
        .stat-card { background:white; padding:20px; border-radius:16px; text-align:center; }
        .admin-tabs { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
        .tab-btn { padding:10px 24px; background:var(--gray-200); border:none; border-radius:30px; cursor:pointer; }
        .tab-btn.active { background:var(--primary); color:white; }
        .admin-panel { background:white; border-radius:20px; padding:24px; }
        .table-responsive { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:12px; text-align:left; border-bottom:1px solid var(--gray-200); }
        .badge { padding:4px 12px; border-radius:20px; font-size:0.8rem; }
        .badge-admin { background:var(--primary); color:white; }
        .action-btn { padding:6px 12px; border:none; border-radius:8px; cursor:pointer; margin:0 4px; }
        .pagination { display:flex; gap:8px; justify-content:center; margin-top:20px; }
        .page-btn { padding:8px 12px; border:1px solid var(--gray-300); background:white; border-radius:8px; cursor:pointer; }
        .page-btn.active { background:var(--primary); color:white; }
        @media (prefers-color-scheme: dark) {
            .stat-card, .admin-panel, table, .page-btn { background: #1e293b; color: #e2e8f0; border-color: #334155; }
            .tab-btn { background: #334155; color: #cbd5e1; }
            .tab-btn.active { background: var(--primary); color: white; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h1>Admin Dashboard</h1>
            <button id="logoutBtn" class="btn btn-secondary">Logout</button>
        </div>
        <div class="stats-cards" id="statsCards"></div>
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchTab('users')">Users</button>
            <button class="tab-btn" onclick="switchTab('exams')">Exams</button>
            <button class="tab-btn" onclick="switchTab('subjects')">Subject Performance</button>
            <button class="tab-btn" onclick="switchTab('questions')">Question Bank</button>
        </div>
        <div class="admin-panel" id="adminPanel"></div>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
