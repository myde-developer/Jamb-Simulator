<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="global.css">

    <style>
/* ===== UNIVERSAL FIX FOR DESKTOP SITE MODE ===== */

/* Ensure all clickable elements work properly */
button,
a,
.subject-tab,
.filter-btn,
.palette-item,
.option,
.nav-menu a,
.btn,
.action-btn,
.rating-btn,
.deck-card,
.flashcard {
    cursor: pointer;
    position: relative;
    z-index: auto;
    -webkit-tap-highlight-color: transparent;
}

/* Fix for sticky headers that might block clicks */
.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: white;
}

/* Ensure main content doesn't get hidden under header */
main, .container, .practice-container, .flashcards-container, .results-container {
    position: relative;
    z-index: 1;
}

/* Fix for subject tabs - ensure they're clickable */
.subject-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    position: relative;
    z-index: 10;
}

.subject-tab {
    cursor: pointer;
    pointer-events: auto;
    position: relative;
    z-index: 20;
}

/* Fix for palette items */
.palette-grid {
    display: grid;
    gap: 10px;
}

.palette-item {
    cursor: pointer;
    pointer-events: auto;
    position: relative;
    z-index: 5;
}

/* Override any transform that might break click area */
.palette-item.current,
.subject-tab.active {
    transform: none !important;
}

/* Ensure all buttons are clickable on desktop view */
@media (min-width: 769px) {
    .subject-tab,
    .filter-btn,
    .palette-item,
    .option,
    .nav-menu a,
    .btn,
    .action-btn {
        cursor: pointer;
        transition: all 0.2s ease;
    }
    
    .subject-tab:hover,
    .filter-btn:hover,
    .palette-item:hover,
    .option:hover {
        transform: translateY(-2px);
    }
    
    /* Fix for any elements with transform that might block clicks */
    .subject-tab:active,
    .filter-btn:active,
    .palette-item:active {
        transform: scale(0.98);
    }
}
    /* ===== FINAL ADMIN CSS - COMPLETE & PRODUCTION READY ===== */

/* ===== RESET & BASE ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: #f5f7fa;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.6;
    color: #2c3e50;
}

/* ===== HEADER ===== */
.header {
    position: sticky;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.nav-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 1.5rem;
    font-weight: 800;
    white-space: nowrap;
    background: rgba(255,255,255,0.15);
    padding: 0.5rem 1.2rem;
    border-radius: 40px;
    letter-spacing: 0.5px;
    backdrop-filter: blur(5px);
}

.nav-menu {
    display: flex;
    list-style: none;
    gap: 0.5rem;
    align-items: center;
    margin: 0;
    padding: 0;
}

.nav-menu a {
    color: white;
    text-decoration: none;
    padding: 0.6rem 1.2rem;
    border-radius: 40px;
    transition: all 0.3s;
    font-weight: 600;
    white-space: nowrap;
    font-size: 0.95rem;
    border: 2px solid transparent;
}

.nav-menu a:hover,
.nav-menu a.active {
    background: rgba(255,255,255,0.2);
    border-color: rgba(255,255,255,0.3);
    transform: translateY(-2px);
}

/* ===== MAIN CONTAINER ===== */
.admin-container {
    max-width: 1400px;
    margin: 20px auto 50px;
    padding: 0 20px;
    flex: 1;
    width: 100%;
}

/* ===== ADMIN HEADER ===== */
.admin-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 30px 35px;
    border-radius: 24px;
    margin-bottom: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 15px 35px rgba(102, 126, 234, 0.3);
    border: 1px solid rgba(255,255,255,0.1);
}

.admin-title h1 {
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    margin-bottom: 8px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.admin-title p {
    opacity: 0.95;
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    font-weight: 400;
}

.admin-logout {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 2px solid rgba(255,255,255,0.3);
    padding: 12px 30px;
    border-radius: 50px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    transition: all 0.3s;
    white-space: nowrap;
    backdrop-filter: blur(5px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.admin-logout:hover {
    background: rgba(255,255,255,0.25);
    border-color: rgba(255,255,255,0.5);
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

/* ===== STATS CARDS ===== */
.stats-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 22px;
    margin-bottom: 35px;
}

.stat-card {
    background: white;
    padding: 28px 20px;
    border-radius: 24px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.05);
    text-align: center;
    transition: all 0.3s;
    border: 1px solid rgba(0,0,0,0.03);
    position: relative;
    overflow: hidden;
}

.stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #667eea, #764ba2);
}

.stat-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 35px rgba(102, 126, 234, 0.15);
}

.stat-card h3 {
    color: #64748b;
    font-size: 0.95rem;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
}

.stat-card .number {
    font-size: clamp(2.2rem, 5vw, 3rem);
    font-weight: 800;
    color: #1e293b;
    line-height: 1.2;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* ===== SCROLLABLE TABS ===== */
.admin-tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    padding: 8px 0 12px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: #667eea #e0e0e0;
    position: relative;
}

.admin-tabs::-webkit-scrollbar {
    height: 6px;
}

.admin-tabs::-webkit-scrollbar-track {
    background: #f0f0f0;
    border-radius: 10px;
}

.admin-tabs::-webkit-scrollbar-thumb {
    background: #667eea;
    border-radius: 10px;
}

.admin-tabs::-webkit-scrollbar-thumb:hover {
    background: #5a6fd6;
}

.tab-btn {
    padding: 12px 30px;
    border: none;
    border-radius: 50px;
    background: white;
    color: #1e293b;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    flex: 0 0 auto;
    min-height: 48px;
    min-width: 48px;
    white-space: nowrap;
    letter-spacing: 0.3px;
    border: 2px solid transparent;
}

.tab-btn.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    border-color: rgba(255,255,255,0.2);
}

.tab-btn:hover:not(.active) {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.1);
    background: #f8fafc;
    border-color: #667eea;
}

/* ===== ADMIN PANEL ===== */
.admin-panel {
    background: white;
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.05);
    border: 1px solid rgba(0,0,0,0.03);
}

/* ===== SEARCH BAR ===== */
.search-bar {
    margin-bottom: 25px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.search-bar input {
    flex: 1;
    min-width: 280px;
    padding: 15px 20px;
    border: 2px solid #e2e8f0;
    border-radius: 50px;
    font-size: 1rem;
    transition: all 0.3s;
    background: white;
}

.search-bar input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
}

.search-bar button {
    padding: 15px 32px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s;
    white-space: nowrap;
    min-width: 130px;
    font-size: 0.95rem;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}

.search-bar button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
}

.export-btn {
    background: #10b981;
    color: white;
    border: none;
    padding: 15px 32px;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s;
    white-space: nowrap;
    min-width: 150px;
    font-size: 0.95rem;
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
}

.export-btn:hover {
    background: #059669;
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
}

/* ===== TABLES ===== */
.table-responsive {
    overflow-x: auto;
    margin: 0 -5px;
    padding: 0 5px;
    -webkit-overflow-scrolling: touch;
    border-radius: 16px;
    border: 1px solid #e2e8f0;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 750px;
}

th {
    background: #f8fafc;
    padding: 18px 16px;
    text-align: left;
    font-weight: 700;
    color: #1e293b;
    font-size: 0.9rem;
    white-space: nowrap;
    border-bottom: 2px solid #e2e8f0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

td {
    padding: 18px 16px;
    border-bottom: 1px solid #e2e8f0;
    font-size: 0.95rem;
    color: #334155;
}

tr:hover {
    background: #f8fafc;
}

/* ===== BADGES ===== */
.badge {
    padding: 6px 16px;
    border-radius: 50px;
    font-size: 0.8rem;
    font-weight: 600;
    display: inline-block;
    white-space: nowrap;
    text-align: center;
    min-width: 80px;
}

.badge-admin {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
}

.badge-user {
    background: #e2e8f0;
    color: #475569;
}

/* ===== SCORE COLORS ===== */
.score-high {
    color: #059669;
    font-weight: 700;
    background: rgba(5, 150, 105, 0.1);
    padding: 4px 12px;
    border-radius: 50px;
    display: inline-block;
    font-size: 0.9rem;
}

.score-medium {
    color: #d97706;
    font-weight: 700;
    background: rgba(217, 119, 6, 0.1);
    padding: 4px 12px;
    border-radius: 50px;
    display: inline-block;
    font-size: 0.9rem;
}

.score-low {
    color: #dc2626;
    font-weight: 700;
    background: rgba(220, 38, 38, 0.1);
    padding: 4px 12px;
    border-radius: 50px;
    display: inline-block;
    font-size: 0.9rem;
}

/* ===== ACTION BUTTONS ===== */
.action-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    background: #f1f5f9;
    margin: 0 4px;
    transition: all 0.3s;
    font-size: 0.9rem;
    min-width: 42px;
    color: #475569;
    font-weight: 500;
}

.action-btn:hover {
    background: #667eea;
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
}

/* ===== PAGINATION CONTAINER ===== */
.pagination-container {
    position: relative;
    width: 100%;
    margin-top: 35px;
    padding: 5px 0;
}

/* ===== SCROLLABLE PAGINATION ===== */
.pagination {
    display: flex;
    gap: 8px;
    padding: 12px 5px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    justify-content: center;
    scroll-behavior: smooth;
    scrollbar-color: #667eea transparent;
}

.pagination:hover,
.pagination:active,
.pagination:focus {
    scrollbar-color: #667eea #e0e0e0;
}

.pagination::-webkit-scrollbar {
    height: 6px;
    background: transparent;
}

.pagination::-webkit-scrollbar-track {
    background: transparent;
    border-radius: 10px;
}

.pagination::-webkit-scrollbar-thumb {
    background: #667eea;
    border-radius: 10px;
    opacity: 0;
}

.pagination:hover::-webkit-scrollbar-thumb,
.pagination:active::-webkit-scrollbar-thumb {
    background: #667eea;
}

/* ===== PAGE BUTTONS ===== */
.page-btn {
    flex: 0 0 auto;
    min-width: 48px;
    height: 48px;
    padding: 0 16px;
    border: 2px solid #e2e8f0;
    background: white;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 0.95rem;
    font-weight: 600;
    color: #475569;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.page-btn.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-color: transparent;
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    transform: scale(1.05);
}

.page-btn:hover:not(.active) {
    background: #f8fafc;
    border-color: #667eea;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
}

.page-btn.disabled {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
}

.page-dots {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 35px;
    height: 48px;
    color: #64748b;
    font-weight: 600;
    font-size: 1.1rem;
}

/* ===== FADE INDICATORS ===== */
.pagination-container::before,
.pagination-container::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50px;
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.3s;
}

.pagination-container::before {
    left: 0;
    background: linear-gradient(to right, white, transparent);
}

.pagination-container::after {
    right: 0;
    background: linear-gradient(to left, white, transparent);
}

.pagination-container.can-scroll-left::before,
.pagination-container.can-scroll-right::after {
    opacity: 1;
}

/* ===== FORMS ===== */
#questionForm, #editQuestionForm {
    max-width: 100%;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #1e293b;
    font-size: 0.95rem;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    font-size: 1rem;
    transition: all 0.3s;
    background: white;
    color: #1e293b;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
}

/* ===== LOADING STATES ===== */
.loading-spinner {
    display: inline-block;
    width: 50px;
    height: 50px;
    border: 4px solid #f1f5f9;
    border-top: 4px solid #667eea;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.no-data {
    text-align: center;
    padding: 4rem 1rem;
    color: #64748b;
    font-size: 1.2rem;
    background: #f8fafc;
    border-radius: 16px;
    border: 2px dashed #e2e8f0;
}

.error-message {
    background: #fef2f2;
    color: #dc2626;
    padding: 2rem;
    border-radius: 16px;
    text-align: center;
    border: 2px solid #fee2e2;
}

.error-message button {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    padding: 1rem 2.5rem;
    border-radius: 50px;
    margin-top: 1.5rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s;
    font-size: 1rem;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}

.error-message button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.admin-panel {
    animation: fadeIn 0.4s ease-out;
}

.stat-card {
    animation: fadeIn 0.4s ease-out;
    animation-fill-mode: both;
}

.stat-card:nth-child(1) { animation-delay: 0.1s; }
.stat-card:nth-child(2) { animation-delay: 0.15s; }
.stat-card:nth-child(3) { animation-delay: 0.2s; }
.stat-card:nth-child(4) { animation-delay: 0.25s; }

/* ===== TABLET (768px and below) ===== */
@media screen and (max-width: 768px) {
    .nav-container {
        flex-direction: column;
        padding: 1rem;
        gap: 1rem;
    }
    
    .nav-menu {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.4rem;
    }
    
    .nav-menu a {
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
    }
    
    .admin-header {
        flex-direction: column;
        text-align: center;
        gap: 1.5rem;
        padding: 25px;
    }
    
    .admin-logout {
        width: 100%;
        max-width: 300px;
    }
    
    .stats-cards {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }
    
    .admin-panel {
        padding: 20px;
    }
    
    .search-bar {
        flex-direction: column;
    }
    
    .search-bar input,
    .search-bar button,
    .export-btn {
        width: 100%;
    }
    
    th, td {
        padding: 14px 12px;
        font-size: 0.9rem;
    }
    
    .badge {
        padding: 4px 12px;
        font-size: 0.75rem;
        min-width: 70px;
    }
    
    .pagination {
        justify-content: flex-start;
    }
}

/* ===== MOBILE (480px and below) ===== */
@media screen and (max-width: 480px) {
    .logo {
        font-size: 1.2rem;
        padding: 0.4rem 1rem;
    }
    
    .nav-menu {
        gap: 0.3rem;
    }
    
    .nav-menu a {
        font-size: 0.75rem;
        padding: 0.4rem 0.8rem;
    }
    
    .stats-cards {
        grid-template-columns: 1fr;
        gap: 12px;
    }
    
    .stat-card .number {
        font-size: 2rem;
    }
    
    .admin-title h1 {
        font-size: 1.4rem;
    }
    
    .admin-title p {
        font-size: 0.9rem;
    }
    
    .tab-btn {
        padding: 10px 20px;
        font-size: 0.85rem;
        min-height: 42px;
    }
    
    th, td {
        padding: 12px 10px;
        font-size: 0.8rem;
    }
    
    .action-btn {
        padding: 6px 12px;
        font-size: 0.8rem;
        min-width: 36px;
    }
    
    .page-btn {
        min-width: 40px;
        height: 40px;
        padding: 0 12px;
        font-size: 0.85rem;
    }
    
    .page-dots {
        height: 40px;
        min-width: 30px;
        font-size: 1rem;
    }
    
    .pagination-container::before,
    .pagination-container::after {
        width: 30px;
    }
}

/* ===== SMALL MOBILE (320px and below) ===== */
@media screen and (max-width: 320px) {
    .page-btn {
        min-width: 36px;
        height: 36px;
        padding: 0 8px;
        font-size: 0.8rem;
    }
    
    .page-dots {
        height: 36px;
        min-width: 25px;
    }
    
    .badge {
        padding: 3px 8px;
        font-size: 0.7rem;
        min-width: 60px;
    }
    
    .action-btn {
        padding: 5px 8px;
        margin: 2px;
    }
}

/* ===== LANDSCAPE MODE ===== */
@media screen and (max-height: 600px) and (orientation: landscape) {
    .header {
        position: relative;
    }
    
    .admin-container {
        margin-top: 10px;
    }
    
    .stats-cards {
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }
    
    .admin-header {
        padding: 20px;
    }
}

/* ===== TOUCH DEVICES ===== */
@media (hover: none) and (pointer: coarse) {
    .tab-btn,
    .action-btn,
    .page-btn,
    .search-bar button,
    .export-btn,
    .admin-logout {
        min-height: 52px;
    }
    
    .tab-btn:hover,
    .action-btn:hover,
    .page-btn:hover {
        transform: none;
    }
    
    .tab-btn:active,
    .action-btn:active,
    .page-btn:active {
        transform: scale(0.98);
    }
}

/* ===== DARK MODE ===== */
@media (prefers-color-scheme: dark) {
    body {
        background: #0f172a;
        color: #e2e8f0;
    }
    
    .stat-card,
    .admin-panel,
    .tab-btn,
    table,
    .page-btn,
    .no-data,
    #questionForm,
    #editQuestionForm {
        background: #1e293b;
        color: #e2e8f0;
        border-color: #334155;
    }
    
    .stat-card h3 {
        color: #94a3b8;
    }
    
    th {
        background: #334155;
        color: #f1f5f9;
        border-bottom-color: #475569;
    }
    
    td {
        border-bottom-color: #334155;
        color: #cbd5e1;
    }
    
    tr:hover {
        background: #2d3748;
    }
    
    .search-bar input,
    .form-group input,
    .form-group select,
    .form-group textarea {
        background: #2d3748;
        border-color: #4a5568;
        color: #e2e8f0;
    }
    
    .badge-user {
        background: #334155;
        color: #cbd5e1;
    }
    
    .page-btn {
        border-color: #4a5568;
        color: #cbd5e1;
    }
    
    .page-btn:hover:not(.active) {
        background: #2d3748;
    }
    
    .action-btn {
        background: #334155;
        color: #cbd5e1;
    }
    
    .action-btn:hover {
        background: #667eea;
        color: white;
    }
    
    .no-data {
        background: #1e293b;
        border-color: #334155;
        color: #94a3b8;
    }
    
    .pagination-container::before {
        background: linear-gradient(to right, #1e293b, transparent);
    }
    
    .pagination-container::after {
        background: linear-gradient(to left, #1e293b, transparent);
    }
    
    .admin-tabs::-webkit-scrollbar-track {
        background: #334155;
    }
}

/* ===== PRINT STYLES ===== */
@media print {
    .header,
    .admin-header,
    .admin-tabs,
    .search-bar,
    .pagination,
    .action-btn,
    .export-btn,
    .admin-logout {
        display: none !important;
    }
      .admin-container {
        margin: 0;
        padding: 0;
    }
    
    .admin-panel {
        box-shadow: none;
        padding: 0;
        border: 1px solid #000;
    }
    
    table {
        border: 1px solid #000;
    }
    
    th, td {
        border: 1px solid #000;
    }
}

    <script>
        (function() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const adminFlag = localStorage.getItem('is_admin');

                window.location.replace('/home.html');
                return;
            }
        })();
